<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Arkiv - Estetik & Stil</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="/">
                <img src="/public/logo.svg" alt="Logo">
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="/">Hem</a></li>
                <li><a href="/about/">Om mig</a></li>
                <li><a href="/archive/">Arkiv</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Arkiv</h2>
<p>Här kan du filtrera poster baserat på tag eller månad!</p>

<div class="filters">
    <strong>Filtrera på Taggar:</strong>
    <button onclick="filterPosts('tag', 'all')">Alla</button>
    <button onclick="filterPosts('tag', 'mode')">Mode</button>
    <button onclick="filterPosts('tag', 'inredning')">Inredning</button>
    <button onclick="filterPosts('tag', 'fotografi')">Fotografi</button>
    <br><br>
    <strong>Filtrera på Månad:</strong>
    <button onclick="filterPosts('month', 'all')">Alla</button>
    <button onclick="filterPosts('month', 'oktober')">Oktober</button>
    <button onclick="filterPosts('month', 'november')">November</button>
</div>

<div class="archive-post post" data-tag="mode" data-month="oktober">
    <h3>Höstens trender 2026</h3>
    <p style="color: grey;">Taggar: Mode | Månad: Oktober</p>
    <a href="/posts/hostens-trender/">Läs inlägget</a>
</div>

<div class="archive-post post" data-tag="inredning" data-month="november">
    <h3>Att inreda med ljus</h3>
    <p style="color: grey;">Taggar: Inredning | Månad: November</p>
    <a href="/posts/inreda-med-ljus/">Läs inlägget</a>
</div>


    </main>


    <script src="/js/main.js"></script>
</body>
</html>
